<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业务数据看板 · 汽车销售运营中心</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#080d18;
  --panel:rgba(19,28,45,.72);
  --panel-2:rgba(26,37,58,.6);
  --line:rgba(56,74,104,.55);
  --line-soft:rgba(56,74,104,.32);
  --txt:#e6edf7;
  --txt-dim:#8fa2bf;
  --txt-mute:#5f7391;
  --blue:#3b82f6;
  --cyan:#06b6d4;
  --green:#10b981;
  --amber:#f59e0b;
  --violet:#8b5cf6;
  --pink:#ec4899;
}
*{box-sizing:border-box}
body{
  margin:0;background:
    radial-gradient(1200px 600px at 12% -8%,rgba(37,99,235,.16),transparent 60%),
    radial-gradient(900px 500px at 92% 6%,rgba(6,182,212,.10),transparent 60%),
    var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(71,92,128,.55);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:rgba(90,116,160,.75)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(9,14,26,.86);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.brand-logo{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,#2563eb,#22d3ee);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:19px;color:#fff;
  box-shadow:0 4px 16px rgba(37,99,235,.45);
}
.date-input{
  background:rgba(15,23,42,.9);border:1px solid var(--line);
  color:var(--txt);border-radius:8px;padding:6px 10px;font-size:13px;
  outline:none;font-family:inherit;
}
.date-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.16)}
.date-input::-webkit-calendar-picker-indicator{filter:invert(.7)}
.quick-btn{
  padding:6px 13px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);color:var(--txt-dim);
  background:rgba(15,23,42,.6);cursor:pointer;transition:all .16s;font-family:inherit;
}
.quick-btn:hover{color:var(--txt);border-color:rgba(96,165,250,.6);background:rgba(30,58,95,.6)}
.quick-btn.active{
  color:#fff;border-color:transparent;
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  box-shadow:0 4px 14px rgba(37,99,235,.4);
}
.apply-btn{
  padding:6px 18px;border-radius:8px;font-size:13px;font-weight:600;
  border:none;color:#fff;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  box-shadow:0 4px 14px rgba(37,99,235,.4);transition:all .16s;
}
.apply-btn:hover{filter:brightness(1.12);transform:translateY(-1px)}

/* ---------- 通用面板 ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  position:relative;
  overflow:hidden;
}
.panel::before{
  content:'';position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 32%);
}
.sec-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px}
.sec-title::before{
  content:'';width:4px;height:17px;border-radius:2px;
  background:linear-gradient(180deg,#60a5fa,#2563eb);
}
.sec-sub{font-size:12px;color:var(--txt-mute);margin-top:4px;margin-left:13px}
.legend-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}

/* ---------- 总览条 ---------- */
.overview-bar{
  background:linear-gradient(135deg,rgba(23,37,64,.92),rgba(15,25,45,.92));
  border:1px solid var(--line);border-radius:14px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
  overflow:hidden;position:relative;
}
.overview-bar::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,#22d3ee,#2563eb);
}
.ov-item{padding:15px 20px;position:relative}
.ov-item+.ov-item{border-left:1px solid var(--line-soft)}
.ov-label{font-size:12px;color:var(--txt-mute);margin-bottom:7px}
.ov-value{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.ov-delta{font-size:12px;margin-top:5px}

/* ---------- 指标卡 ---------- */
.metric-card{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:12px;padding:15px 16px 12px;
  cursor:pointer;transition:all .18s;position:relative;overflow:hidden;
}
.metric-card:hover{
  border-color:rgba(96,165,250,.75);
  transform:translateY(-3px);
  box-shadow:0 10px 30px rgba(37,99,235,.22);
  background:rgba(31,45,70,.75);
}
.metric-card::after{
  content:'';position:absolute;left:0;top:0;height:2.5px;width:0;
  background:linear-gradient(90deg,#60a5fa,#22d3ee);transition:width .28s;
}
.metric-card:hover::after{width:100%}
.mc-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mc-ico{
  width:26px;height:26px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:13px;flex-shrink:0;
}
.mc-label{font-size:13px;color:#b9c8de;font-weight:500}
.mc-value{font-size:31px;font-weight:800;letter-spacing:-1px;line-height:1;display:flex;align-items:baseline;gap:5px}
.mc-unit{font-size:12px;font-weight:500;color:var(--txt-mute)}
.mc-meta{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:12px;flex-wrap:wrap}
.mc-ratio{color:var(--txt-mute)}
.chip{padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600}
.chip.up{background:rgba(16,185,129,.14);color:#34d399}
.chip.down{background:rgba(244,63,94,.14);color:#fb7185}
.chip.flat{background:rgba(148,163,184,.14);color:#cbd5e1}
.mc-chart{height:52px;margin-top:8px;margin-left:-4px;margin-right:-4px}
.mc-hint{
  position:absolute;right:12px;top:12px;font-size:11px;color:var(--txt-mute);
  opacity:0;transition:opacity .18s;
}
.metric-card:hover .mc-hint{opacity:1;color:#93c5fd}

/* ---------- 漏斗 ---------- */
.funnel-row{
  position:relative;margin:0 auto 9px;border-radius:9px;cursor:pointer;
  background:linear-gradient(90deg,#1d4ed8,#2563eb 55%,#3b82f6);
  display:flex;align-items:center;padding:11px 15px;gap:10px;
  transition:all .18s;box-shadow:0 3px 12px rgba(37,99,235,.22);
  width:var(--w);
}
.funnel-row:hover{
  filter:brightness(1.16);transform:scale(1.022);
  box-shadow:0 6px 22px rgba(59,130,246,.42);
}
.funnel-row .fr-idx{
  width:19px;height:19px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,.16);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.funnel-row .fr-name{font-size:13.5px;font-weight:600;white-space:nowrap}
.funnel-row .fr-spacer{flex:1}
.funnel-row .fr-value{font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.funnel-row .fr-ratio{
  background:rgba(255,255,255,.18);border-radius:20px;
  font-size:11px;font-weight:600;padding:2px 8px;white-space:nowrap;min-width:52px;text-align:center;
}
.funnel-row .fr-ratio.ghost{background:transparent;color:rgba(255,255,255,.45)}

/* 迷你漏斗 */
.mini-funnel{padding:10px 0 4px}
.mf-row{
  width:var(--w);margin:0 auto 5px;border-radius:6px;padding:5px 11px;
  background:linear-gradient(90deg,rgba(37,99,235,.85),rgba(59,130,246,.7));
  display:flex;align-items:center;gap:8px;font-size:12px;
}
.mf-row .mf-name{font-weight:600;white-space:nowrap}
.mf-row .mf-sp{flex:1}
.mf-row .mf-val{font-weight:700}
.mf-row .mf-ratio{font-size:10.5px;background:rgba(255,255,255,.16);border-radius:14px;padding:1px 6px}

/* ---------- 门店 / 顾问 列表 ---------- */
.store-card{
  background:var(--panel-2);border:1px solid var(--line);
  border-radius:12px;padding:15px 17px;transition:all .18s;
}
.store-card:hover{border-color:rgba(96,165,250,.6);background:rgba(31,45,70,.7)}
.rank-badge{
  width:26px;height:26px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;color:#fff;
}
.rank-1{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.rank-2{background:linear-gradient(135deg,#64748b,#94a3b8)}
.rank-3{background:linear-gradient(135deg,#b45309,#d97706)}
.rank-n{background:rgba(71,92,128,.5)}
.store-name{font-size:15px;font-weight:700}
.store-sub{font-size:11.5px;color:var(--txt-mute)}
.stage-value{font-size:23px;font-weight:800;letter-spacing:-.5px}
.link-btn{
  padding:5px 13px;border-radius:8px;font-size:12.5px;font-weight:600;
  border:1px solid rgba(96,165,250,.45);color:#93c5fd;
  background:rgba(37,99,235,.12);cursor:pointer;transition:all .16s;font-family:inherit;
  white-space:nowrap;
}
.link-btn:hover{background:rgba(37,99,235,.3);color:#fff;border-color:#60a5fa}
.chain-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px;
}
.chain-cell{
  background:rgba(15,23,42,.62);border:1px solid var(--line-soft);
  border-radius:8px;padding:7px 9px;
}
.chain-cell .cc-label{font-size:10.5px;color:var(--txt-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chain-cell .cc-value{font-size:14.5px;font-weight:700;margin-top:3px}
.chain-cell.active{border-color:rgba(96,165,250,.75);background:rgba(37,99,235,.18)}

details.sf{margin-top:11px}
details.sf>summary{
  list-style:none;cursor:pointer;font-size:12px;color:#93c5fd;
  display:inline-flex;align-items:center;gap:5px;user-select:none;
  padding:4px 11px;border-radius:7px;background:rgba(37,99,235,.1);
  border:1px solid rgba(96,165,250,.28);transition:all .15s;
}
details.sf>summary::-webkit-details-marker{display:none}
details.sf>summary:hover{background:rgba(37,99,235,.24);color:#fff}
details.sf>summary::after{content:'▾';transition:transform .2s;display:inline-block}
details.sf[open]>summary::after{transform:rotate(180deg)}

/* ---------- 面包屑 ---------- */
.crumb{
  display:flex;align-items:center;gap:8px;font-size:13px;
  color:var(--txt-dim);flex-wrap:wrap;
}
.crumb a,.crumb span.ck{cursor:pointer;transition:color .15s}
.crumb a:hover,.crumb span.ck:hover{color:#93c5fd}
.crumb .sep{color:var(--txt-mute)}
.crumb .cur{color:var(--txt);font-weight:600}
.back-btn{
  padding:6px 15px;border-radius:8px;font-size:13px;font-weight:600;
  border:1px solid var(--line);background:rgba(15,23,42,.7);
  color:var(--txt-dim);cursor:pointer;transition:all .16s;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;
}
.back-btn:hover{color:#fff;border-color:rgba(96,165,250,.65);background:rgba(30,58,95,.7)}

/* ---------- 布局 ---------- */
.home-layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.home-right{position:sticky;top:86px}
.metric-grid-4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.metric-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:1280px){
  .home-layout{grid-template-columns:minmax(0,1fr) 340px}
  .metric-grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:1080px){
  .home-layout{grid-template-columns:1fr}
  .home-right{position:static}
  .chain-grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:720px){
  .overview-bar{grid-template-columns:repeat(2,1fr)}
  .metric-grid-4,.metric-grid-2{grid-template-columns:1fr}
  .chain-grid{grid-template-columns:repeat(2,1fr)}
}
.empty-tip{padding:60px 20px;text-align:center;color:var(--txt-mute);font-size:14px}
</style>
</head>
<body>

<!-- ============ 顶栏 ============ -->
<header class="topbar">
  <div class="max-w-[1800px] mx-auto px-5 py-3 flex items-center gap-4 flex-wrap">
    <div class="flex items-center gap-3">
      <div class="brand-logo">D</div>
      <div>
        <div class="text-[15px] font-bold leading-tight">业务数据看板</div>
        <div class="text-[11px] text-slate-500 leading-tight">汽车销售运营中心 · 全链路下钻</div>
      </div>
    </div>

    <div class="flex items-center gap-2 ml-2 flex-wrap">
      <span class="text-[12px] text-slate-500">起始</span>
      <input type="date" id="startDate" class="date-input">
      <span class="text-slate-600">—</span>
      <span class="text-[12px] text-slate-500">终止</span>
      <input type="date" id="endDate" class="date-input">
      <div class="flex gap-1.5 ml-1">
        <button class="quick-btn" data-range="7">近7天</button>
        <button class="quick-btn" data-range="30">近30天</button>
        <button class="quick-btn" data-range="90">近90天</button>
      </div>
      <button id="applyBtn" class="apply-btn">应用筛选</button>
    </div>

    <div class="ml-auto flex items-center gap-4">
      <div class="text-right">
        <div class="text-[11px] text-slate-500">当前数据范围</div>
        <div class="text-[12.5px] text-slate-200 font-medium" id="rangeText">-- 至 --</div>
      </div>
      <div class="text-right pl-4 border-l border-slate-700/50">
        <div class="text-[11px] text-slate-500">实时时间</div>
        <div class="text-[13px] text-cyan-300 font-mono" id="current-time">--:--:--</div>
      </div>
    </div>
  </div>
</header>

<!-- ============ 主区 ============ -->
<main class="max-w-[1800px] mx-auto px-5 py-5">
  <div id="view"></div>
  <footer class="text-center text-xs text-slate-600 py-6">
    数据看板 v3.0 · 当前展示为模拟数据 · 全链路漏斗与三大模块均支持下钻至门店 / 顾问
  </footer>
</main>

<script>
/* =========================================================================
   1. 基础配置：门店 / 顾问 / 指标 / 漏斗
   ========================================================================= */
const STORES = [
  { id:'s1',  name:'北京朝阳店', weight:1.16 },
  { id:'s2',  name:'上海浦东店', weight:1.11 },
  { id:'s3',  name:'广州天河店', weight:1.05 },
  { id:'s4',  name:'深圳南山店', weight:1.02 },
  { id:'s5',  name:'成都高新店', weight:0.98 },
  { id:'s6',  name:'杭州西湖店', weight:0.95 },
  { id:'s7',  name:'武汉江汉店', weight:0.91 },
  { id:'s8',  name:'南京鼓楼店', weight:0.87 },
  { id:'s9',  name:'西安雁塔店', weight:0.83 },
  { id:'s10', name:'重庆渝北店', weight:0.79 }
];

const ADVISOR_NAMES = [
  '张伟','李娜','王强','刘洋','陈静',
  '杨帆','赵磊','孙悦','周涛','吴敏',
  '郑凯','冯雪','韩磊','曹颖','许鹏',
  '邓超','沈月','程琳','高峰','彭飞',
  '谢东','卢薇','姜鹏','苏晴','范磊',
  '董浩','于蕾','袁明','石磊','严婷',
  '倪涛','熊英','金鹏','陆瑶','郝强',
  '阮亮','尹雪','林峰','崔健','万清',
  '侯磊','罗薇','荆明','唐悦','傅强',
  '钟毅','邵华','廖敏','耿直','初阳'
];

const METRICS = [
  { key:'leads',         label:'线索数量', unit:'条', color:'#3b82f6', icon:'📞', group:'lead' },
  { key:'validLeads',    label:'有效线索', unit:'条', color:'#06b6d4', icon:'✅', group:'lead',   base:'leads',      ratioLabel:'有效率' },
  { key:'intentLeads',   label:'意向线索', unit:'条', color:'#f59e0b', icon:'⭐', group:'lead',   base:'validLeads', ratioLabel:'意向度' },
  { key:'invites',       label:'邀约数量', unit:'次', color:'#10b981', icon:'📅', group:'lead',   base:'intentLeads',ratioLabel:'邀约率' },
  { key:'arrivals',      label:'到店人数', unit:'人', color:'#3b82f6', icon:'🏬', group:'visit',  base:'invites',    ratioLabel:'到店率' },
  { key:'testDrives',    label:'试驾人数', unit:'人', color:'#06b6d4', icon:'🚗', group:'visit',  base:'arrivals',   ratioLabel:'试驾率' },
  { key:'returnVisits',  label:'回访人数', unit:'人', color:'#8b5cf6', icon:'🔁', group:'visit',  base:'testDrives', ratioLabel:'回访率' },
  { key:'opportunities', label:'商机数量', unit:'个', color:'#10b981', icon:'💼', group:'visit',  base:'returnVisits',ratioLabel:'商机率' },
  { key:'locked',        label:'锁单数量', unit:'单', color:'#10b981', icon:'🔒', group:'result', base:'opportunities',ratioLabel:'锁单率' },
  { key:'delivered',     label:'交车数量', unit:'辆', color:'#ec4899', icon:'🚙', group:'result', base:'locked',     ratioLabel:'交付率' }
];
const METRIC_MAP = Object.fromEntries(METRICS.map(m => [m.key, m]));

/* 全链路 7 阶段（漏斗） */
const FUNNEL = [
  { key:'leads',      label:'新增线索' },
  { key:'validLeads', label:'有效线索' },
  { key:'invites',    label:'邀约排程' },
  { key:'arrivals',   label:'到店' },
  { key:'testDrives', label:'有效试驾' },
  { key:'locked',     label:'锁单' },
  { key:'delivered',  label:'交付' }
];

const GROUPS = [
  { id:'lead',   title:'线索入口', sub:'从线索进入到邀约排程的全链路数据 · 区间合计', metrics:['leads','validLeads','intentLeads','invites'],       cols:4 },
  { id:'visit',  title:'到店接待', sub:'从到店到商机建立的全链路数据 · 区间合计',     metrics:['arrivals','testDrives','returnVisits','opportunities'], cols:4 },
  { id:'result', title:'结果面板', sub:'最终成交与交付数据 · 区间合计',              metrics:['locked','delivered'],                                  cols:2 }
];

/* =========================================================================
   2. 模拟数据生成
   ========================================================================= */
function seededRandom(seed){
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function(){
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}
const TODAY = new Date();
const ONE_DAY = 24 * 60 * 60 * 1000;
const dateStr = d => d.toISOString().slice(0, 10);
const addDays = (d, n) => new Date(d.getTime() + n * ONE_DAY);
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }

function generateDailySeries(seed, base, weeklyFactor = 0.55, trend = 0.0009){
  const rnd = seededRandom(seed);
  const series = {};
  for (let i = 364; i >= 0; i--){
    const d = addDays(TODAY, -i);
    const day = d.getDay();
    const isWeekend = (day === 0 || day === 6);
    const noise = 0.72 + rnd() * 0.56;
    const factor = isWeekend ? weeklyFactor : 1;
    const t = (364 - i) / 364;
    const v = Math.max(0, Math.round(base * factor * noise * (1 + trend * (t - 0.5) * 2)));
    series[dateStr(d)] = v;
  }
  return series;
}
function deriveSeries(src, ratio, seed){
  const rnd = seededRandom(seed);
  const out = {};
  for (const k in src){
    const r = Math.max(0, Math.min(1, ratio * (0.86 + rnd() * 0.28)));
    out[k] = Math.max(0, Math.round(src[k] * r));
  }
  return out;
}

/* 数据结构：
   storeSeries[sid][metricKey] = { 'YYYY-MM-DD': number }
   advisors[sid] = [ { id, name, share, series:{ metricKey: {date:number} } } ]
   totalSeries[metricKey] = { date: number }
*/
const storeSeries = {};
const advisors = {};
const totalSeries = {};
METRICS.forEach(m => totalSeries[m.key] = {});

function buildAll(){
  STORES.forEach((store, si) => {
    const seedBase = 1000 + si * 137;
    const s = {};
    s.leads         = generateDailySeries(seedBase,    12 * store.weight);
    s.validLeads    = deriveSeries(s.leads,         0.62, seedBase + 1);
    s.intentLeads   = deriveSeries(s.validLeads,    0.55, seedBase + 2);
    s.invites       = deriveSeries(s.intentLeads,   0.78, seedBase + 3);
    s.arrivals      = deriveSeries(s.invites,       0.72, seedBase + 4);
    s.testDrives    = deriveSeries(s.arrivals,      0.68, seedBase + 5);
    s.returnVisits  = deriveSeries(s.testDrives,    0.74, seedBase + 6);
    s.opportunities = deriveSeries(s.returnVisits,  0.82, seedBase + 7);
    s.locked        = deriveSeries(s.opportunities, 0.46, seedBase + 8);
    s.delivered     = deriveSeries(s.locked,        0.88, seedBase + 9);
    storeSeries[store.id] = s;

    METRICS.forEach(m => {
      const tgt = totalSeries[m.key], src = s[m.key];
      for (const day in src) tgt[day] = (tgt[day] || 0) + src[day];
    });

    advisors[store.id] = buildAdvisors(store, si, s, seedBase);
  });
}

function buildAdvisors(store, si, storeSer, seedBase){
  const rnd = seededRandom(seedBase + 777);
  let raw = [];
  for (let i = 0; i < 5; i++) raw.push(0.62 + rnd() * 0.76);
  const sumRaw = raw.reduce((a,b) => a + b, 0);
  const shares = raw.map(r => r / sumRaw);

  const list = [];
  for (let i = 0; i < 5; i++){
    list.push({
      id: store.id + '_a' + i,
      storeId: store.id,
      storeName: store.name,
      name: ADVISOR_NAMES[(si * 5 + i) % ADVISOR_NAMES.length],
      share: shares[i],
      series: {}
    });
  }

  METRICS.forEach((m, mi) => {
    const src = storeSer[m.key];
    const rs = seededRandom(seedBase + 3000 + mi * 13);
    list.forEach(a => a.series[m.key] = {});
    for (const day in src){
      const total = src[day];
      const ws = list.map(a => a.share * (0.84 + rs() * 0.32));
      const sumW = ws.reduce((a,b) => a + b, 0) || 1;
      let acc = 0;
      list.forEach((a, i) => {
        let v;
        if (i === list.length - 1){ v = Math.max(0, total - acc); }
        else { v = Math.round(total * ws[i] / sumW); acc += v; }
        a.series[m.key][day] = v;
      });
    }
  });
  return list;
}

/* =========================================================================
   3. 工具函数
   ========================================================================= */
function sumRange(series, start, end){
  let sum = 0;
  for (const k in series) if (k >= start && k <= end) sum += series[k];
  return sum;
}
function rangeSeries(series, start, end){
  const out = [];
  const s = parseDate(start), e = parseDate(end);
  for (let d = new Date(s); d <= e; d = addDays(d, 1)) out.push(series[dateStr(d)] || 0);
  return out;
}
const fmtNum = n => Math.round(n).toLocaleString('zh-CN');
function pct(curr, prev){
  if (prev === 0) return curr === 0 ? 0 : 100;
  return ((curr - prev) / prev) * 100;
}
function rate(curr, base){ return base === 0 ? 0 : (curr / base) * 100; }
function chipHTML(v){
  const cls = v > 0.5 ? 'up' : (v < -0.5 ? 'down' : 'flat');
  const ico = v > 0.5 ? '↑' : (v < -0.5 ? '↓' : '→');
  return `<span class="chip ${cls}">${ico} ${Math.abs(v).toFixed(1)}%</span>`;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function calcRange(){
  const start = $start.value, end = $end.value;
  if (!start || !end || start > end) return null;
  const lenDays = Math.round((parseDate(end) - parseDate(start)) / ONE_DAY) + 1;
  const prevEnd = dateStr(addDays(parseDate(start), -1));
  const prevStart = dateStr(addDays(parseDate(prevEnd), -(lenDays - 1)));
  return { start, end, prevStart, prevEnd, lenDays };
}
function setRange(days){
  const end = new Date(TODAY);
  const start = addDays(end, -(days - 1));
  $start.value = dateStr(start);
  $end.value = dateStr(end);

}

function metricValues(seriesArr, r){
  // seriesArr: {metricKey: series}；返回 { key: {v, prev, delta} }
  const out = {};
  METRICS.forEach(m => {
    const src = seriesArr[m.key] || totalSeries[m.key];
    const v = sumRange(src, r.start, r.end);
    const prev = sumRange(src, r.prevStart, r.prevEnd);
    out[m.key] = { v, prev, delta: pct(v, prev) };
  });
  return out;
}

      <div class="flex items-center gap-3 flex-wrap">
        <span class="rank-badge ${rankCls}">${rank + 1}</span>
        <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-[14px]"
             style="background:${avaColor}28;color:${avaColor};border:1px solid ${avaColor}55">${esc(a.name[0])}</div>
        <div>
          <div class="store-name">${esc(a.name)}</div>
          <div class="store-sub">${esc(store.name)} · 业绩占比 ${(a.share * 100).toFixed(1)}% · 门店内排名 ${rank + 1} / ${rows.length}</div>
        </div>
        <div class="ml-3">
          <div class="text-[11px] text-slate-500">${stageLabel}</div>
          <div class="stage-value" style="color:#93c5fd">${fmtNum(x.value)}</div>
        </div>
        <div class="flex items-center gap-3 ml-auto flex-wrap">
          <div class="text-right">
            <div class="text-[11px] text-slate-500">${prevMetricKey ? (METRIC_MAP[stageKey]?.ratioLabel || '转化率') : '占门店比'}</div>
            <div class="text-[14px] font-bold text-emerald-400">
              ${prevMetricKey ? ratio.toFixed(1) + '%' : (totalVal === 0 ? '0.0' : (x.value / totalVal * 100).toFixed(1)) + '%'}
            </div>
          </div>
          <div class="text-right">
            <div class="text-[11px] text-slate-500">环比</div>
            <div class="mt-0.5">${chipHTML(delta)}</div>
          </div>
        </div>
      </div>
      <div class="chain-grid">${chainCells}</div>
      <details class="sf">
        <summary>展开个人漏斗</summary>
        <div class="mini-funnel">${miniFunnel}</div>
      </details>
    </div>`;
  }).join('');

  return `
    ${crumb([
      { label:'首页', click:'goHome()' },
      { label:'门店维度', click:`navigate('stores',{stage:'${stageKey}'})` },
      { label:store.name },
      { label:stageLabel }
    ])}
    <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
      <div>
        <div class="text-[19px] font-bold">${esc(store.name)} · 顾问维度</div>
        <div class="text-[12.5px] text-slate-500 mt-1">共 ${rows.length} 名顾问 · ${stageLabel} · 区间 ${r.start} ~ ${r.end}</div>
      </div>
      <button class="back-btn" onclick="navigate('stores',{stage:'${stageKey}'})">← 返回门店维度</button>
    </div>
    <section class="panel p-5 mb-5">
      <div class="sec-title">${esc(store.name)} · 全链路漏斗</div>
      <div class="sec-sub mb-4">点击任一阶段可在顾问维度切换指标</div>
      <div>${FUNNEL.map((f, i) => {
        const v = sumRange(storeSeries[store.id][f.key], r.start, r.end);
        const mv = Math.max(1, sumRange(storeSeries[store.id][FUNNEL[0].key], r.start, r.end));
        const w = 46 + 54 * (v / mv);
        const pv = i === 0 ? null : sumRange(storeSeries[store.id][FUNNEL[i-1].key], r.start, r.end);
        const rr = pv === null ? null : rate(v, pv);
        const isActive = f.key === stageKey;
        return `<div class="funnel-row" style="--w:${w.toFixed(1)}%;${isActive ? 'outline:2px solid #93c5fd;outline-offset:2px' : ''}" onclick="navigate('advisors',{store:'${store.id}',stage:'${f.key}'})">
          <span class="fr-idx">${i + 1}</span>
          <span class="fr-name">${f.label}</span>
          <span class="fr-spacer"></span>
          <span class="fr-value">${fmtNum(v)}</span>
          ${rr === null ? '<span class="fr-ratio ghost">—</span>' : `<span class="fr-ratio">${rr.toFixed(2)}%</span>`}
        </div>`;
      }).join('')}</div>
    </section>
    <div class="flex flex-col gap-4">${cards}</div>`;
}

/* =========================================================================
   10. 主渲染
   ========================================================================= */
function render(){
  const r = calcRange();
  if (!r) return;
  $rangeText.textContent = `${r.start} 至 ${r.end}`;

  disposeCharts();
  const view = document.getElementById('view');

  if (state.route === 'stores'){
    view.innerHTML = renderStores(r);
  } else if (state.route === 'advisors'){
    view.innerHTML = renderAdvisors(r);
  } else {
    view.innerHTML = renderHome(r);
    initHomeCharts(r);
  }
  window.scrollTo(0, 0);
}

/* =========================================================================
   11. 事件绑定与启动
   ========================================================================= */
$quickBtns.forEach(b => b.addEventListener('click', () => setRange(parseInt(b.dataset.range))));
$apply.addEventListener('click', render);
window.addEventListener('resize', () => chartPool.forEach(c => { try{ c.resize(); }catch(e){} }));

function tickClock(){ document.getElementById('current-time').textContent = new Date().toLocaleTimeString('zh-CN'); }
setInterval(tickClock, 1000);
tickClock();

buildAll();
parseRoute();
setRange(7);
</script>
</body>
</html>
